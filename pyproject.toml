[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-eval"
version = "1.1.0"
description = "SAGE: Safety & Agent Growth Evaluator — Measuring Security Boundary Drift and Capability Retention in Self-Evolving Code Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pratik P. Jain", email = "pratik.12620589@vit.edu" },
    { name = "Janhavi B. Pagare", email = "janhavi.1252010010@vit.edu" },
    { name = "Aditya U. Dengale", email = "aditya.1252010025@vit.edu" },
    { name = "Naitik K. Kharat", email = "naitik.12620301@vit.edu" },
    { name = "Shamika R. Kadam", email = "shamika.12620290@vit.edu" },
    { name = "Vikrant K. Kadam", email = "vikrant.1252010030@vit.edu" }
]

keywords = [
    "autonomous-agents",
    "evaluation",
    "security-boundary-drift",
    "vulnerability-injection-rate",
    "reward-hacking",
    "benchmarking"
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "duckdb>=0.9.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "httpx>=0.24.0"
]

[project.urls]
Homepage = "https://github.com/Pratikjain24/SAGE"
Repository = "https://github.com/Pratikjain24/SAGE"
Documentation = "https://github.com/Pratikjain24/SAGE#readme"
"HuggingFace Dataset" = "https://github.com/Pratikjain24/SAGE"
"Issue Tracker" = "https://github.com/Pratikjain24/SAGE/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0"
]

[project.scripts]
sage = "sage.runner.cli:app"
sage-live = "sage_live.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sage*", "sage_live*"]

[tool.pytest.ini_options]
# Comprehensive regression test suite: 201 tests across 31 test files (100% pass rate)
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "real_llm: Tests exercising live or simulated vLLM / OpenAI-compatible endpoints",
    "gpu: Tests requiring GPU hardware runner",
]
