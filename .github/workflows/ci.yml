name: CI & Public Reproducibility Verification

# ─────────────────────────────────────────────────────────────────────────────
# All jobs run on GitHub-hosted runners (ubuntu-latest).
# Logs, test reports, and attestation artifacts are publicly visible at:
#   https://github.com/Pratikjain24/SAGE/actions
# This constitutes genuine third-party infrastructure verification —
# results cannot be modified by the repository author after the run completes.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── Job 1: Lint, Test & Public Verification ───────────────────────────────
  lint-and-test:
    name: "Test Suite (Python ${{ matrix.python-version }}) — GitHub-hosted"
    runs-on: ubuntu-latest
    permissions:
      checks: write       # publish test results as GitHub Checks
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest-md-report

    - name: Validate Benchmark Tasks Catalog
      run: python -m sage.runner.cli tasks validate

    - name: Verify Pinned Model Revisions (Pilot Config)
      run: python -m sage.runner.cli verify-env --config configs/experiments/pilot.yaml

    - name: Verify Pinned Model Revisions (Full Study Config)
      run: python -m sage.runner.cli verify-env --config configs/experiments/full_study.yaml

    - name: Run Full Regression Test Suite
      run: |
        pytest tests/ -v --durations=20 \
          --junitxml=test-results/junit-${{ matrix.python-version }}.xml \
          --md-report --md-report-output=test-results/report-${{ matrix.python-version }}.md
      continue-on-error: false

    - name: Publish Test Results to GitHub Job Summary
      if: always()
      run: |
        echo "## 🧪 SAGE Test Suite — Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Runner**: \`${{ runner.os }}\` / \`ubuntu-latest\` (GitHub-hosted)" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Run ID**: [\`${{ github.run_id }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f test-results/report-${{ matrix.python-version }}.md ]; then
          cat test-results/report-${{ matrix.python-version }}.md >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> ℹ️ These results are generated by GitHub Actions on GitHub infrastructure." >> $GITHUB_STEP_SUMMARY
        echo "> They are immutable once the run completes and cannot be edited by the repository owner." >> $GITHUB_STEP_SUMMARY

    - name: Upload JUnit XML Test Report (Public Artifact)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: test-results/
        retention-days: 90

    - name: Publish JUnit Results as GitHub Check
      if: always() && matrix.python-version == '3.10'
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'test-results/junit-3.10.xml'
        check_name: 'SAGE Test Results'
        fail_on_failure: true
        require_tests: true

    - name: Run Dry-Run Benchmark Execution Harness
      run: python -m sage.runner.cli run --config configs/experiments/pilot.yaml --dry-run

    - name: Run Reproducibility Digest Verification
      run: python scripts/verify_reproducibility.py

    - name: Verify Cryptographic Attestation Chain & SQLite WAL
      run: |
        chmod +x ./sage-live || true
        ./sage-live attest verify || python -m sage_live.cli attest verify

    - name: Upload Reproducibility Attestation (Python 3.10 — Authoritative)
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@v4
      with:
        name: reproducibility-attestation-github-hosted
        path: |
          verification_attestation.json
          REPRODUCIBILITY_VERIFICATION.md
        retention-days: 90

  # ── Job 2: Docker Build & Image Digest Verification ───────────────────────
  docker-build-and-verify:
    name: "Docker Build & Digest Verification — GitHub-hosted"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Sandbox Container
      run: |
        docker build -f docker/Dockerfile.sandbox -t sage-sandbox:1.0 .
        docker inspect --format='{{index .Id}}' sage-sandbox:1.0

    - name: Build Scorer Container
      run: |
        docker build -f docker/Dockerfile.scorer -t sage-scorer:1.0 .
        docker inspect --format='{{index .Id}}' sage-scorer:1.0

    - name: Build Backend Container
      run: |
        docker build -f docker/Dockerfile.backend -t sage-backend:1.0 .
        docker inspect --format='{{index .Id}}' sage-backend:1.0

    - name: Build Frontend Container
      run: |
        docker build -f docker/Dockerfile.frontend -t sage-frontend:1.0 .
        docker inspect --format='{{index .Id}}' sage-frontend:1.0

    - name: Verify Container Image Digests Match Committed JSON
      run: python scripts/build_and_inspect_images.py --verify

    - name: Publish Docker Verification to Job Summary
      if: always()
      run: |
        echo "## 🐳 Docker Image Digest Verification" >> $GITHUB_STEP_SUMMARY
        echo "**Runner**: \`ubuntu-latest\` (GitHub-hosted, clean environment)" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All four container images built from scratch on GitHub infrastructure and digests verified against \`docker/image_digests.json\`." >> $GITHUB_STEP_SUMMARY

