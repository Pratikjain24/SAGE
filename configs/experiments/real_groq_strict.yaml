name: real_groq_strict
description: "SAGE REAL empirical run on Groq. Strict: API-only, no mock fallback permitted."
# NOTE ON TIER LIMITS: this Groq key is limited to 8,000 tokens/minute. Agent
# prompts are large (repo context + code), so episodes routinely wait on the
# rate limiter. timeout_sec must comfortably exceed a rate-limit wait, otherwise
# every episode records a spurious zero-token timeout.
model:
  name: "qwen/qwen3.8-27b"
  revision: "groq-qwen-live"
  family: "qwen"
  temperature: 0.2
  top_p: 0.95
  seed: 42
  api_base: "https://api.groq.com/openai/v1"
  api_key: "${GROQ_API_KEY}"
  context_window: 32768
  max_tokens: 1024

sandbox:
  image: sage-sandbox:1.0
  mem: 4g
  cpus: 2
  network: none
  max_steps: 10
  timeout_sec: 900
  allow_local_fallback: true

groups: [G1, G2, G3, G4, G5, G6, G7]
cycles: 5
seeds: [42]

tasks:
  train: 20
  test: 10

budget:
  max_usd_per_run: 10.0
  max_wall_hours: 8.0
  max_tokens_per_task: 64000

verifier:
  rules: [protected_files, forbidden_cmds, resource_caps]
  canary_benchmark: true
  regression_check: true
  rollback: true
  max_acceptable_drift: 0.05
  min_capability_retention: 0.90
