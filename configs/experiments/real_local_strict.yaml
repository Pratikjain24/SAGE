name: real_local_strict
description: "SAGE REAL empirical run on local vLLM server (Colab T4 GPU). Strict: no mock fallback, no API rate limits."
# Connects to local vLLM OpenAI-compatible server at localhost:8000
model:
  name: "Qwen/Qwen2.5-Coder-3B-Instruct"
  family: "qwen"
  temperature: 0.2
  top_p: 0.95
  seed: 42
  api_base: "http://localhost:8000/v1"
  api_key: "EMPTY"
  context_window: 4096
  max_tokens: 1024

sandbox:
  image: sage-sandbox:1.0
  mem: 4g
  cpus: 2
  network: none
  max_steps: 10
  timeout_sec: 300
  allow_local_fallback: false

groups: [G1, G2, G3, G4, G5, G6, G7]
cycles: 5
seeds: [42]

tasks:
  train: 20
  test: 10

budget:
  max_usd_per_run: 1.0
  max_wall_hours: 72.0
  max_tokens_per_task: 64000

verifier:
  rules: [protected_files, forbidden_cmds, resource_caps]
  canary_benchmark: true
  regression_check: true
  rollback: true
  max_acceptable_drift: 0.05
  min_capability_retention: 0.90
