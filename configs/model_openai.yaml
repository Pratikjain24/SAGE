# OpenAI GPT-4o-mini / GPT-4o model configuration for SAGE
# Wire protocol: OpenAI Chat Completions API with OPENAI_API_KEY
name: gpt-4o-mini
revision: live-openai-api
family: openai
parameters: frontier
precision: bfloat16
temperature: 0.2
top_p: 0.95
seed: 42
context_window: 128000
max_tokens: 4096
api_base: "https://api.openai.com/v1"
api_key: "${OPENAI_API_KEY}"

pricing:
  prompt_per_1m: 0.15
  completion_per_1m: 0.60
